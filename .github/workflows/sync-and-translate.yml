name: Sync Upstream and Translate on New Release

on:
  schedule:
    # Run every Monday at 9:00 AM JST (00:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      run_mode:
        description: >-
          実行目的:
          auto = 定期実行と同じ（新リリースがあれば同期・翻訳） /
          retranslate-latest = 翻訳品質に問題があったとき最新リリース分を訳し直す /
          fill-missing-translations = 過去に失敗・スキップした未翻訳ファイルを補完する /
          cleanup-only = 翻訳せず古いPR・ブランチの掃除だけ行う
        required: false
        type: choice
        default: 'auto'
        options:
          - auto
          - retranslate-latest
          - fill-missing-translations
          - cleanup-only
      dry_run:
        description: '掃除の安全確認: クローズ・削除対象を一覧表示するだけで実行しない'
        required: false
        type: boolean
        default: false
      retry_attempt:
        description: '(内部用) タイムアウト自動リトライのカウンタ。手動実行では変更しない'
        required: false
        type: number
        default: 0

concurrency:
  group: sync-and-translate
  cancel-in-progress: false

permissions: {}

env:
  AWS_REGION: us-west-2
  ANTHROPIC_MODEL: global.anthropic.claude-opus-4-6-v1
  # claude プロセスの同時実行数。Bedrockのスロットリングが目立つ場合は下げる
  TRANSLATE_PARALLEL_JOBS: "4"
  UPSTREAM_REPO: splunk/observability-workshop
  UPSTREAM_BRANCH: main
  FORK_REPO: ${{ github.repository }}
  LAST_TAG_FILE: .last-translated-tag
  # schedule トリガーでは inputs.* が空になるため 'auto' に正規化する
  RUN_MODE: ${{ inputs.run_mode || 'auto' }}
  # 1回の実行でクローズする陳腐化PRの上限（初回事故時の被害を局所化する安全装置）
  CLEANUP_MAX_PRS: "10"
  # CI実行時にclaudeへ注入する翻訳ルール（Setup translation tools ステップで取得）
  TRANSLATION_GUIDE: /tmp/translation-guide.md

jobs:
  check-new-release:
    name: Check for new upstream release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      has_new_release: ${{ steps.check.outputs.has_new_release }}
      new_tag: ${{ steps.check.outputs.new_tag }}
      last_tag: ${{ steps.check.outputs.last_tag }}
    steps:
      - name: Checkout translation system branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git || true
          git fetch upstream --tags

      - name: Check for new release tags
        id: check
        run: |
          # Get the latest release tag from upstream (semantic versioning)
          LATEST_TAG=$(git tag -l 'v*' --sort=-version:refname | head -1)

          if [ -z "$LATEST_TAG" ]; then
            echo "No release tags found in upstream"
            echo "has_new_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Latest upstream tag: ${LATEST_TAG}"

          # Get the last translated tag from our tracking file
          LAST_TAG=""
          if [ -f "${{ env.LAST_TAG_FILE }}" ]; then
            LAST_TAG=$(cat "${{ env.LAST_TAG_FILE }}")
            echo "Last translated tag: ${LAST_TAG}"
          else
            echo "No previous translation record found"
          fi

          case "$RUN_MODE" in
            retranslate-latest)
              # 訳し直しモード: 比較ベースを1つ前の翻訳タグに巻き戻し、
              # 直近リリース分の変更ファイルを再翻訳対象にする。
              # 1つ前の値は .last-translated-tag のgit履歴（2番目に新しいコミット）から取得
              PREV_COMMIT=$(git log -n 2 --format=%H -- "${{ env.LAST_TAG_FILE }}" | sed -n 2p)
              PREV_TAG=""
              if [ -n "$PREV_COMMIT" ]; then
                PREV_TAG=$(git show "${PREV_COMMIT}:${{ env.LAST_TAG_FILE }}" 2>/dev/null | tr -d '[:space:]' || true)
              fi
              if [ -n "$PREV_TAG" ]; then
                echo "Retranslate mode: comparing ${PREV_TAG}..${LATEST_TAG}"
                LAST_TAG="$PREV_TAG"
              else
                echo "Retranslate mode: no previous tag history, using current last tag"
              fi
              echo "has_new_release=true" >> $GITHUB_OUTPUT
              echo "new_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
              echo "last_tag=${LAST_TAG}" >> $GITHUB_OUTPUT
              exit 0
              ;;
            fill-missing-translations)
              # 未翻訳補完モード: 新リリースの有無に関わらず最新タグで実行する
              echo "Fill-missing mode: proceeding with ${LATEST_TAG}"
              echo "has_new_release=true" >> $GITHUB_OUTPUT
              echo "new_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
              echo "last_tag=${LAST_TAG}" >> $GITHUB_OUTPUT
              exit 0
              ;;
          esac

          # Compare tags
          if [ "$LATEST_TAG" = "$LAST_TAG" ]; then
            echo "No new release to translate"
            echo "has_new_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "New release detected: ${LATEST_TAG}"
          echo "has_new_release=true" >> $GITHUB_OUTPUT
          echo "new_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "last_tag=${LAST_TAG}" >> $GITHUB_OUTPUT

  sync-and-translate:
    name: Sync main and translate
    needs: check-new-release
    if: inputs.run_mode != 'cleanup-only' && needs.check-new-release.outputs.has_new_release == 'true'
    runs-on: ubuntu-24.04
    # 翻訳ステップ(240分) + 前後処理を収める。AWS認証はcredential_processで
    # 都度更新されるため、IAMロールのMaxSessionDurationには縛られない
    timeout-minutes: 300
    permissions:
      id-token: write
      contents: write
    outputs:
      translation_branch: ${{ steps.translate-branch.outputs.branch_name }}
      translated_count: ${{ steps.translate.outputs.translated_count }}
      failed_count: ${{ steps.translate.outputs.failed_count }}
      has_new_workshops: ${{ steps.detect-new-workshops.outputs.has_new_workshops }}
      new_workshops: ${{ steps.detect-new-workshops.outputs.new_workshops }}
      has_commits: ${{ steps.commit.outputs.has_commits }}
      mirror_change_count: ${{ steps.mirror.outputs.change_count }}
      mirror_report: ${{ steps.mirror.outputs.report }}
      parity_warning_count: ${{ steps.parity.outputs.warning_count }}
      parity_warnings: ${{ steps.parity.outputs.warnings }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0
          # GITHUB_TOKEN cannot push changes to .github/workflows/* files.
          # Use FORK_SYNC_PAT (Contents + Workflows write, fork-only) so the
          # subsequent `git push origin main --force` is authenticated as a PAT.
          # See .github/SECURITY-NOTES.md.
          token: ${{ secrets.FORK_SYNC_PAT }}

      - name: Setup upstream remote
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git || true
          git fetch upstream --tags ${{ env.UPSTREAM_BRANCH }}

      - name: Sync main with upstream
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          NEW_TAG="${{ needs.check-new-release.outputs.new_tag }}"

          # Reset main to upstream tag
          git reset --hard "${NEW_TAG}"

          # Push synced main (credential set by actions/checkout with FORK_SYNC_PAT)
          git push origin main --force

      - name: Detect files to translate
        id: detect
        run: |
          NEW_TAG="${{ needs.check-new-release.outputs.new_tag }}"
          LAST_TAG="${{ needs.check-new-release.outputs.last_tag }}"

          # 差分翻訳対象の検出（fill-missing モードでは差分は対象にしない）
          TRANSLATION_TARGETS=""
          if [ "$RUN_MODE" != "fill-missing-translations" ]; then
            # Determine comparison base
            if [ -n "$LAST_TAG" ]; then
              COMPARE_BASE="${LAST_TAG}"
            else
              # First run: translate all existing English content
              COMPARE_BASE=$(git rev-list --max-parents=0 HEAD)
            fi

            echo "Comparing ${COMPARE_BASE}..${NEW_TAG}"

            # Get changed English markdown files
            CHANGED_FILES=$(git diff --name-only "${COMPARE_BASE}..${NEW_TAG}" -- ':(glob)content/en/**/*.md' 2>/dev/null | sort || true)

            # Filter files that need translation
            for file in $CHANGED_FILES; do
              if [ ! -f "$file" ]; then
                continue
              fi
              TRANSLATION_TARGETS="${TRANSLATION_TARGETS}${file}"$'\n'
            done
          fi

          # 未翻訳ファイルの補完対象を検出（fill-missing モードのみ）
          UNTRANSLATED_FILES=""
          if [ "$RUN_MODE" = "fill-missing-translations" ]; then
            echo "Scanning for all untranslated files..."

            for en_file in $(find content/en -name "*.md" -type f 2>/dev/null | sort); do
              ja_file="${en_file/content\/en/content\/ja}"

              if [ ! -f "$ja_file" ]; then
                UNTRANSLATED_FILES="${UNTRANSLATED_FILES}${en_file}"$'\n'
              fi
            done
          fi

          # Combine files
          ALL_FILES="${TRANSLATION_TARGETS}${UNTRANSLATED_FILES}"

          if [ -z "$ALL_FILES" ] || [ "$ALL_FILES" = $'\n' ]; then
            echo "has_files=false" >> $GITHUB_OUTPUT
            echo "No files need translation"
            exit 0
          fi

          # Write file list to a temporary file (avoids GITHUB_OUTPUT size limits)
          echo "$ALL_FILES" | grep -v '^$' > /tmp/files_to_translate.txt
          FILE_COUNT=$(wc -l < /tmp/files_to_translate.txt)

          echo "has_files=true" >> $GITHUB_OUTPUT
          echo "file_count=${FILE_COUNT}" >> $GITHUB_OUTPUT

          echo "Files to translate (${FILE_COUNT} files):"
          cat /tmp/files_to_translate.txt

      - name: Detect new workshops
        id: detect-new-workshops
        if: steps.detect.outputs.has_files == 'true'
        run: |
          LAST_TAG="${{ needs.check-new-release.outputs.last_tag }}"

          # If no previous tag (first run), skip detection - no baseline to compare
          if [ -z "$LAST_TAG" ]; then
            echo "No previous tag - skipping new workshop detection"
            # NOTE: "yes"/"no" instead of "true"/"false" is a workaround for a Slack Workflow Builder bug
            # where string literals "true"/"false" cause branch condition evaluation errors.
            echo "has_new_workshops=no" >> $GITHUB_OUTPUT
            exit 0
          fi

          COMPARE_BASE="${LAST_TAG}"

          # Extract workshop-level directories from translation targets
          # Pattern: content/en/{category}/{workshop-name}/...
          # Workshop level = first 4 path components (depth 4)
          NEW_WORKSHOPS=""
          CHECKED_DIRS=""

          while IFS= read -r file; do
            # Extract workshop-level directory (first 4 path components)
            # Files with fewer than 5 components (e.g. category _index.md) are skipped
            WORKSHOP_DIR=$(echo "$file" | awk -F'/' 'NF>=5{print $1"/"$2"/"$3"/"$4}')

            if [ -z "$WORKSHOP_DIR" ]; then
              continue
            fi

            # Skip images/img directories
            DIRNAME=$(basename "$WORKSHOP_DIR")
            if [ "$DIRNAME" = "images" ] || [ "$DIRNAME" = "img" ]; then
              continue
            fi

            # Skip if already checked
            if echo "$CHECKED_DIRS" | grep -qF "$WORKSHOP_DIR"; then
              continue
            fi
            CHECKED_DIRS="${CHECKED_DIRS}${WORKSHOP_DIR}"$'\n'

            # Check if this workshop directory existed in the previous tag
            if ! git rev-parse --verify "${COMPARE_BASE}:${WORKSHOP_DIR}" >/dev/null 2>&1; then
              # New directory: check if _index.md has draft: true or hidden: true
              # Workshop development starts with draft: true and is released when draft is removed/set to false
              INDEX_FILE="${WORKSHOP_DIR}/_index.md"
              IS_DRAFT=""
              if [ -f "$INDEX_FILE" ]; then
                IS_DRAFT=$(awk '/^---/{c++; if(c==2) exit} c==1 && /^(draft|hidden):[[:space:]]*true/' "$INDEX_FILE")
              fi
              if [ -n "$IS_DRAFT" ]; then
                echo "Skipping draft/hidden workshop: ${WORKSHOP_DIR}"
              else
                echo "New released workshop detected: ${WORKSHOP_DIR}"
                NEW_WORKSHOPS="${NEW_WORKSHOPS}${WORKSHOP_DIR}"$'\n'
              fi
            fi
          done < /tmp/files_to_translate.txt

          # Detect workshops that changed from draft: true to released (draft removed or set to false)
          # This covers the case where a workshop existed before but was in draft state
          while IFS= read -r index_file; do
            if [ -z "$index_file" ]; then continue; fi
            WORKSHOP_DIR=$(echo "$index_file" | awk -F'/' 'NF==5{print $1"/"$2"/"$3"/"$4}')
            if [ -z "$WORKSHOP_DIR" ]; then continue; fi
            # Skip if already recorded
            if echo "$CHECKED_DIRS" | grep -qF "$WORKSHOP_DIR"; then continue; fi
            # Skip if this is a new directory (handled above as case 1)
            if ! git rev-parse --verify "${COMPARE_BASE}:${index_file}" >/dev/null 2>&1; then continue; fi
            # Check if draft: true or hidden: true existed in previous tag
            OLD_CONTENT=$(git show "${COMPARE_BASE}:${index_file}" 2>/dev/null || echo "")
            WAS_DRAFT=$(echo "$OLD_CONTENT" | awk '/^---/{c++; if(c==2) exit} c==1 && /^(draft|hidden):[[:space:]]*true/')
            if [ -z "$WAS_DRAFT" ]; then continue; fi
            # Check if it is still in draft state now
            IS_DRAFT=$(awk '/^---/{c++; if(c==2) exit} c==1 && /^(draft|hidden):[[:space:]]*true/' "$index_file" 2>/dev/null || echo "")
            if [ -z "$IS_DRAFT" ]; then
              echo "Newly released workshop (draft removed): ${WORKSHOP_DIR}"
              NEW_WORKSHOPS="${NEW_WORKSHOPS}${WORKSHOP_DIR}"$'\n'
              CHECKED_DIRS="${CHECKED_DIRS}${WORKSHOP_DIR}"$'\n'
            fi
          done < <(git diff "${COMPARE_BASE}..HEAD" --name-only -- "content/en/*/*/_index.md" 2>/dev/null || true)

          if [ -n "$NEW_WORKSHOPS" ]; then
            echo "has_new_workshops=yes" >> $GITHUB_OUTPUT
            echo "new_workshops<<EOF" >> $GITHUB_OUTPUT
            echo "$NEW_WORKSHOPS" | grep -v '^$' >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT

            WORKSHOP_COUNT=$(echo "$NEW_WORKSHOPS" | grep -v '^$' | wc -l)
            echo "Detected ${WORKSHOP_COUNT} new workshop(s)"
          else
            echo "has_new_workshops=no" >> $GITHUB_OUTPUT
            echo "No new workshops detected"
          fi

      # aws-actions/configure-aws-credentials はジョブ冒頭に一度だけ取得した静的な
      # 一時クレデンシャルを環境変数に書き出すため、翻訳時間がIAMロールの
      # MaxSessionDuration（組織ポリシーで延長不可）を超えると失効してジョブが失敗する。
      # 代わりに AWS SDK の credential_process を使い、Bedrock呼び出し側のプロセスが
      # 必要とした時点で GitHub OIDC トークン → AssumeRoleWithWebIdentity を都度実行する。
      # 翻訳は1ファイルごとに短命な claude プロセスで行われるため、ジョブ全体の実行時間が
      # セッション上限を超えてもクレデンシャルが失効しない。
      - name: Configure refreshable AWS credentials via OIDC credential_process
        if: steps.detect.outputs.has_files == 'true'
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          mkdir -p "$HOME/.aws"

          cat > "$HOME/.aws/oidc-credential-process.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          # AWS credential_process: GitHub OIDC トークンを取得して AssumeRoleWithWebIdentity を実行する。
          # 取得したクレデンシャルはキャッシュし、失効5分前を切ったら再取得する。
          set -euo pipefail

          CACHE_FILE="${RUNNER_TEMP:-/tmp}/aws-oidc-creds.json"

          if [ -f "$CACHE_FILE" ]; then
            EXPIRATION=$(jq -r '.Expiration // empty' "$CACHE_FILE" 2>/dev/null || true)
            if [ -n "$EXPIRATION" ] && [ "$(date -d "$EXPIRATION" +%s)" -gt "$(( $(date +%s) + 300 ))" ]; then
              cat "$CACHE_FILE"
              exit 0
            fi
          fi

          # OIDC トークンはジョブ実行中いつでも再発行できる（id-token: write 権限が必要）
          JWT=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')

          # AssumeRoleWithWebIdentity は署名不要のAPIなので、AWS CLI 自身の
          # クレデンシャル解決（このスクリプト自身への再帰）を確実に避ける
          CREDS=$(AWS_CONFIG_FILE=/dev/null aws sts assume-role-with-web-identity \
            --role-arn "__ROLE_ARN__" \
            --role-session-name github-actions-translation \
            --web-identity-token "$JWT" \
            --region "${AWS_REGION:-us-west-2}" \
            --query 'Credentials' --output json \
            | jq '{Version: 1, AccessKeyId, SecretAccessKey, SessionToken, Expiration}')

          # 並列実行中の claude プロセスと書き込みが競合しないよう、アトミックに更新する
          TMP_FILE=$(mktemp "${CACHE_FILE}.XXXXXX")
          printf '%s\n' "$CREDS" > "$TMP_FILE"
          mv "$TMP_FILE" "$CACHE_FILE"
          printf '%s\n' "$CREDS"
          SCRIPT

          sed -i "s|__ROLE_ARN__|${AWS_ROLE_ARN}|" "$HOME/.aws/oidc-credential-process.sh"
          chmod +x "$HOME/.aws/oidc-credential-process.sh"

          cat > "$HOME/.aws/config" <<EOF
          [default]
          region = ${AWS_REGION}
          credential_process = ${HOME}/.aws/oidc-credential-process.sh
          EOF

          # AWS SDK v2 系ツールにも ~/.aws/config を読ませる（v3 はデフォルトで読む）
          echo "AWS_SDK_LOAD_CONFIG=1" >> "$GITHUB_ENV"

          # 認証経路をここで検証し、設定ミスは翻訳開始前に fail fast させる
          aws sts get-caller-identity > /dev/null
          echo "AWS credential_process configured and verified"

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24'

      - name: Install Claude Code CLI
        if: steps.detect.outputs.has_files == 'true'
        run: npm install -g @anthropic-ai/claude-code@2

      - name: Setup translation tools
        run: |
          git fetch origin ja-translation-system
          git show origin/ja-translation-system:package.json > package.json
          git show origin/ja-translation-system:package-lock.json > package-lock.json
          git show origin/ja-translation-system:.textlintrc > .textlintrc
          git show origin/ja-translation-system:.markdownlint.json > .markdownlint.json
          mkdir -p .claude/skills/splunk-workshop-ja-translator/textlint-rules
          git show origin/ja-translation-system:.claude/skills/splunk-workshop-ja-translator/textlint-rules/no-ja-trailing-colon.js \
            > .claude/skills/splunk-workshop-ja-translator/textlint-rules/no-ja-trailing-colon.js

          # 翻訳ルール（用語集・文体・構造維持）を取得し、claude呼び出し時に
          # --append-system-prompt で注入する（translate ブランチにはSkillが存在しないため）
          git show origin/ja-translation-system:.claude/skills/splunk-workshop-ja-translator/references/translation-guide.md \
            > "${TRANSLATION_GUIDE}"

          # ミラー同期・機械パッチ・構造検証スクリプトを取得する。
          # --worktree のみ指定で index には乗せない（Commit ステップの git add は
          # content/ja/ 限定なので、これらのファイルがコミットに混入することはない）
          git restore --source=origin/ja-translation-system --worktree -- .github/scripts
          chmod +x .github/scripts/*.sh

          npm ci

      - name: Create translation branch
        id: translate-branch
        run: |
          NEW_TAG="${{ needs.check-new-release.outputs.new_tag }}"
          BRANCH_NAME="translate/${NEW_TAG}"

          # -B = 既存ブランチがあれば現在コミットにリセット、なければ新規作成（冪等）
          git checkout -B "${BRANCH_NAME}"

          # 前回実行が途中で失敗・タイムアウトしていた場合、リモートに残っている
          # 同名ブランチから翻訳済みの content/ja を復元する。復元されたファイルは
          # Translate files ステップでスキップされ、未翻訳分だけを翻訳して再開できる。
          # retranslate-latest は「訳し直し」が目的のため復元しない
          if [ "$RUN_MODE" != "retranslate-latest" ] \
            && git fetch origin "refs/heads/${BRANCH_NAME}" 2>/dev/null; then
            git checkout FETCH_HEAD -- content/ja/ 2>/dev/null || true
            RESTORED_COUNT=$(git diff --name-only HEAD -- content/ja/ | wc -l)
            echo "Restored ${RESTORED_COUNT} file(s) from previous run of ${BRANCH_NAME}"
          fi

          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT

      - name: Mirror assets and prune orphaned Japanese files
        id: mirror
        run: |
          # Phase 1（機械同期）: md以外のアセットを en→ja でミラーし、
          # en側に対応物のない ja側ファイル・ディレクトリを削除する。
          # 変更一覧はPR本文に記載され、PRレビューが安全弁になる
          bash .github/scripts/sync-ja-mirror.sh | tee /tmp/mirror_report.txt

          CHANGE_COUNT=$(grep -cE '^(DELETE|UPDATE|ADD) ' /tmp/mirror_report.txt || true)
          if [ "$CHANGE_COUNT" -gt 0 ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
          echo "change_count=${CHANGE_COUNT}" >> $GITHUB_OUTPUT

          # PR本文用レポート（肥大化防止のため100行で切る）
          echo "report<<MIRROR_EOF" >> $GITHUB_OUTPUT
          head -100 /tmp/mirror_report.txt >> $GITHUB_OUTPUT
          if [ "$(wc -l < /tmp/mirror_report.txt)" -gt 100 ]; then
            echo "... (truncated)" >> $GITHUB_OUTPUT
          fi
          echo "MIRROR_EOF" >> $GITHUB_OUTPUT

      - name: Translate files
        id: translate
        if: steps.detect.outputs.has_files == 'true'
        timeout-minutes: 240
        env:
          CLAUDE_CODE_USE_BEDROCK: "1"
          LAST_TAG: ${{ needs.check-new-release.outputs.last_tag }}
        run: |
          # Configuration
          PARALLEL_JOBS="${TRANSLATE_PARALLEL_JOBS:-4}"
          FILE_TIMEOUT=300  # 5 minutes per file
          MAX_RETRIES=3

          # Create result directories.
          # 残hunk diffは claude の Read ツールで読ませるため、作業ディレクトリ内に置く
          # （/tmp などcwd外は Read の権限で拒否されうる）。.translation-tmp は未追跡かつ
          # Commit ステップの git add 対象（content/ja/）外なのでコミットに混入しない
          mkdir -p /tmp/translate_results "${PWD}/.translation-tmp"

          # 再開サポート: 前回実行（同一タグの translate ブランチ）で翻訳済みのファイルは
          # スキップして成功扱いにする。「ベースコミットと差分があり、かつ日本語を含む」
          # ファイルが対象（mainに残っている古い翻訳はベースと一致するため再翻訳される）
          : > /tmp/files_remaining.txt
          while IFS= read -r EN_FILE; do
            if [ -z "$EN_FILE" ]; then continue; fi
            JA_FILE="${EN_FILE/content\/en/content\/ja}"
            if [ -f "$JA_FILE" ] \
              && ! git diff --quiet HEAD -- "$JA_FILE" \
              && grep -Pq '[\x{3040}-\x{309F}\x{30A0}-\x{30FF}]' "$JA_FILE"; then
              echo "Skipping (translated in previous run): ${EN_FILE}"
              echo "success:${EN_FILE}" > "/tmp/translate_results/$(echo "$EN_FILE" | md5sum | cut -d' ' -f1)"
            else
              echo "$EN_FILE" >> /tmp/files_remaining.txt
            fi
          done < /tmp/files_to_translate.txt

          REMAINING_COUNT=$(grep -c . /tmp/files_remaining.txt || true)
          echo "Files to translate this run: ${REMAINING_COUNT} / $(wc -l < /tmp/files_to_translate.txt)"

          # 翻訳方式の分類:
          #   patch = マージ済みの既存訳（タグと一致し日本語を含む）がある変更ファイル。
          #           enの変更hunkだけを反映する（機械パッチ→LLM差分翻訳→全文翻訳の3段フォールバック）
          #   full  = 新規ファイル・既存訳なし・retranslate-latest モード。全文翻訳
          : > /tmp/files_patch.txt
          : > /tmp/files_full.txt
          while IFS= read -r EN_FILE; do
            if [ -z "$EN_FILE" ]; then continue; fi
            JA_FILE="${EN_FILE/content\/en/content\/ja}"
            if [ "$RUN_MODE" != "retranslate-latest" ] \
              && [ -n "$LAST_TAG" ] \
              && [ -f "$JA_FILE" ] \
              && git diff --quiet HEAD -- "$JA_FILE" \
              && grep -Pq '[\x{3040}-\x{309F}\x{30A0}-\x{30FF}]' "$JA_FILE"; then
              echo "$EN_FILE" >> /tmp/files_patch.txt
            else
              echo "$EN_FILE" >> /tmp/files_full.txt
            fi
          done < /tmp/files_remaining.txt

          echo "Patch-mode files: $(grep -c . /tmp/files_patch.txt || true)"
          echo "Full-mode files: $(grep -c . /tmp/files_full.txt || true)"

          # Define translation function
          translate_file() {
            local EN_FILE="$1"
            local MODE="$2"
            local FILE_TIMEOUT="$3"
            local MAX_RETRIES="$4"
            local RESULT_DIR="/tmp/translate_results"

            if [ -z "$EN_FILE" ]; then
              return 0
            fi

            # Create unique result file based on input path
            local FILE_HASH
            FILE_HASH=$(echo "$EN_FILE" | md5sum | cut -d' ' -f1)
            local RESULT_FILE="${RESULT_DIR}/${FILE_HASH}"

            echo "========================================"
            echo "Translating (${MODE}): ${EN_FILE}"
            echo "========================================"

            # Calculate target path
            local JA_FILE="${EN_FILE/content\/en/content\/ja}"
            local JA_DIR=$(dirname "$JA_FILE")

            # Create target directory
            mkdir -p "$JA_DIR"

            # --- Stage 1+2: 差分パッチ方式 ---
            # 既存訳を保持したまま en の変更分だけを反映する（訳ブレとトークン消費を抑える）
            if [ "$MODE" = "patch" ]; then
              local REMAINING_DIFF="${PWD}/.translation-tmp/${FILE_HASH}.diff"
              local PATCH_STATUS=0
              bash .github/scripts/apply-en-patch.sh \
                "$EN_FILE" "$JA_FILE" "$LAST_TAG" HEAD "$REMAINING_DIFF" || PATCH_STATUS=$?

              if [ "$PATCH_STATUS" -eq 0 ]; then
                echo "Mechanically patched, no LLM needed: ${EN_FILE}"
                echo "success:${EN_FILE}" > "$RESULT_FILE"
                return 0
              fi

              if [ "$PATCH_STATUS" -eq 10 ]; then
                # 機械適用できなかったhunkだけをLLMで差分翻訳する
                local ATTEMPT
                for ATTEMPT in 1 2; do
                  echo "Diff-translation attempt ${ATTEMPT}/2 for ${EN_FILE}..."
                  if timeout "${FILE_TIMEOUT}" claude --print \
                    "The English source file ${EN_FILE} was updated. A unified diff of the English changes that could not be applied mechanically is at ${REMAINING_DIFF} (its paths refer to the Japanese file). Read that diff and the Japanese translation file ${JA_FILE}, then apply the equivalent changes to ${JA_FILE}, translating the changed English text into Japanese. Use minimal Edit operations and do NOT retranslate or rephrase any part that the diff does not touch. Follow the translation rules given in the system prompt." \
                    --append-system-prompt "$(cat "${TRANSLATION_GUIDE}")" \
                    --allowedTools "Edit,Read,Write" \
                    --max-turns $((15 * ATTEMPT)) \
                    2>&1; then
                    echo "Diff-translated: ${EN_FILE}"
                    echo "success:${EN_FILE}" > "$RESULT_FILE"
                    return 0
                  fi
                  echo "Diff-translation attempt ${ATTEMPT} failed for ${EN_FILE}"
                  sleep 10
                done
                echo "Diff-translation failed, falling back to full translation: ${EN_FILE}"
              else
                echo "apply-en-patch.sh exited with ${PATCH_STATUS}, falling back to full translation: ${EN_FILE}"
              fi
            fi

            # --- Stage 3: 全文翻訳 ---
            # Copy the English file to Japanese location first
            cp "$EN_FILE" "$JA_FILE"

            # Copy associated images
            # （新規ディレクトリのみ。既存ディレクトリのアセットはミラー同期ステップが管理）
            local EN_DIR=$(dirname "$EN_FILE")
            if [ -d "${EN_DIR}/img" ] && [ ! -d "${JA_DIR}/img" ]; then
              echo "Copying images from ${EN_DIR}/img to ${JA_DIR}/img"
              cp -r "${EN_DIR}/img" "${JA_DIR}/"
            fi

            # Invoke Claude Code to translate with retry logic
            local RETRY_COUNT=0
            local TRANSLATE_SUCCESS=false

            while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$TRANSLATE_SUCCESS" = "false" ]; do
              RETRY_COUNT=$((RETRY_COUNT + 1))
              # Escalate max-turns on each retry to give large/complex files more room.
              # 1st: 10 turns, 2nd: 20 turns, 3rd: 30 turns
              local CURRENT_MAX_TURNS=$((10 * RETRY_COUNT))
              echo "Translation attempt ${RETRY_COUNT}/${MAX_RETRIES} (max-turns=${CURRENT_MAX_TURNS}) for ${EN_FILE}..."

              if timeout "${FILE_TIMEOUT}" claude --print \
                "Translate the file at ${JA_FILE} from English to Japanese. The source English file is ${EN_FILE}. Translate in place, overwriting the current content of ${JA_FILE}. IMPORTANT: To save turns, use ONE Read followed by ONE Write that overwrites the entire file. Do not use multiple Edit calls. Follow the translation rules given in the system prompt. Ensure Markdown formatting, frontmatter keys, and Hugo shortcodes are preserved." \
                --append-system-prompt "$(cat "${TRANSLATION_GUIDE}")" \
                --allowedTools "Edit,Read,Write" \
                --max-turns "${CURRENT_MAX_TURNS}" \
                2>&1; then
                TRANSLATE_SUCCESS=true
                echo "Successfully translated: ${EN_FILE}"
              else
                local EXIT_CODE=$?
                if [ $EXIT_CODE -eq 124 ]; then
                  echo "TIMEOUT: Translation timed out after ${FILE_TIMEOUT}s for: ${EN_FILE}"
                else
                  echo "Attempt ${RETRY_COUNT} failed for: ${EN_FILE} (exit code: ${EXIT_CODE})"
                fi
                if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                  echo "Retrying in 10 seconds..."
                  sleep 10
                fi
              fi
            done

            if [ "$TRANSLATE_SUCCESS" = "true" ]; then
              echo "success:${EN_FILE}" > "$RESULT_FILE"
            else
              echo "ERROR: All ${MAX_RETRIES} attempts failed for: ${EN_FILE}"
              # Remove the untranslated file to avoid committing English content
              rm -f "$JA_FILE"
              echo "failed:${EN_FILE}" > "$RESULT_FILE"
            fi
          }

          # Export function and variables for parallel execution
          # (RUN_MODE / LAST_TAG / TRANSLATION_GUIDE はworkflow・step envとして既にexport済み)
          export -f translate_file
          export CLAUDE_CODE_USE_BEDROCK

          # Run translations in parallel (patch → full の順で2バッチ)
          echo "Starting parallel translation with ${PARALLEL_JOBS} jobs..."
          if [ -s /tmp/files_patch.txt ]; then
            cat /tmp/files_patch.txt | \
              xargs -P "${PARALLEL_JOBS}" -I {} bash -c 'translate_file "$1" patch "$2" "$3"' _ {} "${FILE_TIMEOUT}" "${MAX_RETRIES}"
          fi
          if [ -s /tmp/files_full.txt ]; then
            cat /tmp/files_full.txt | \
              xargs -P "${PARALLEL_JOBS}" -I {} bash -c 'translate_file "$1" full "$2" "$3"' _ {} "${FILE_TIMEOUT}" "${MAX_RETRIES}"
          fi

          # Aggregate results
          TRANSLATED_COUNT=0
          FAILED_COUNT=0
          FAILED_FILES=""

          for result_file in /tmp/translate_results/*; do
            if [ -f "$result_file" ]; then
              content=$(cat "$result_file")
              if [[ "$content" == success:* ]]; then
                TRANSLATED_COUNT=$((TRANSLATED_COUNT + 1))
              elif [[ "$content" == failed:* ]]; then
                FAILED_COUNT=$((FAILED_COUNT + 1))
                file_path="${content#failed:}"
                FAILED_FILES="${FAILED_FILES}\n- ${file_path}"
              fi
            fi
          done

          echo "Translation complete: ${TRANSLATED_COUNT} succeeded, ${FAILED_COUNT} failed"

          echo "translated_count=${TRANSLATED_COUNT}" >> $GITHUB_OUTPUT
          echo "failed_count=${FAILED_COUNT}" >> $GITHUB_OUTPUT
          echo "failed_files<<EOF" >> $GITHUB_OUTPUT
          echo -e "${FAILED_FILES}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check translation coverage
        id: coverage-check
        if: steps.detect.outputs.has_files == 'true'
        run: |
          UNTRANSLATED_COUNT=0

          while IFS= read -r EN_FILE; do
            if [ -z "$EN_FILE" ]; then continue; fi
            file="${EN_FILE/content\/en/content\/ja}"
            if [ ! -f "$file" ]; then continue; fi
            LINE_COUNT=$(wc -l < "$file")
            if [ "$LINE_COUNT" -lt 5 ]; then continue; fi
            if ! grep -Pq '[\x{3040}-\x{309F}\x{30A0}-\x{30FF}]' "$file"; then
              echo "$EN_FILE" >> /tmp/untranslated_files.txt
              UNTRANSLATED_COUNT=$((UNTRANSLATED_COUNT + 1))
              echo "Untranslated: ${file#content/ja/}"
            fi
          done < /tmp/files_to_translate.txt

          echo "untranslated_count=${UNTRANSLATED_COUNT}" >> $GITHUB_OUTPUT

          if [ "$UNTRANSLATED_COUNT" -gt 0 ]; then
            echo "::warning::${UNTRANSLATED_COUNT} untranslated files detected, will retry translation"
          else
            echo "All files translated successfully"
          fi

      - name: Re-translate untranslated files
        if: steps.detect.outputs.has_files == 'true' && steps.coverage-check.outputs.untranslated_count != '0'
        timeout-minutes: 60
        env:
          CLAUDE_CODE_USE_BEDROCK: "1"
        run: |
          FILE_TIMEOUT=300
          RETRANSLATED=0
          STILL_FAILED=0

          while IFS= read -r EN_FILE; do
            if [ -z "$EN_FILE" ] || [ ! -f "$EN_FILE" ]; then
              continue
            fi

            JA_FILE="${EN_FILE/content\/en/content\/ja}"
            echo "========================================"
            echo "Re-translating: ${EN_FILE}"
            echo "========================================"

            # Re-copy English source to ensure clean state
            cp "$EN_FILE" "$JA_FILE"

            # Retry translation (1 attempt) - use the most generous turn budget for the rescue path
            if timeout "${FILE_TIMEOUT}" claude --print \
              "Translate the file at ${JA_FILE} from English to Japanese. The source English file is ${EN_FILE}. Translate in place, overwriting the current content of ${JA_FILE}. IMPORTANT: To save turns, use ONE Read followed by ONE Write that overwrites the entire file. Do not use multiple Edit calls. Follow the translation rules given in the system prompt. Ensure Markdown formatting, frontmatter keys, and Hugo shortcodes are preserved." \
              --append-system-prompt "$(cat "${TRANSLATION_GUIDE}")" \
              --allowedTools "Edit,Read,Write" \
              --max-turns 30 \
              2>&1; then
              echo "Re-translation completed: ${EN_FILE}"
            else
              echo "Re-translation failed: ${EN_FILE} (exit code: $?)"
            fi

            # Final check: remove if still untranslated
            if [ -f "$JA_FILE" ]; then
              LINE_COUNT=$(wc -l < "$JA_FILE")
              if [ "$LINE_COUNT" -ge 5 ] && ! grep -Pq '[\x{3040}-\x{309F}\x{30A0}-\x{30FF}]' "$JA_FILE"; then
                echo "Still untranslated after retry, removing: ${JA_FILE}"
                rm -f "$JA_FILE"
                STILL_FAILED=$((STILL_FAILED + 1))
              else
                RETRANSLATED=$((RETRANSLATED + 1))
              fi
            fi
          done < /tmp/untranslated_files.txt

          echo "Re-translation complete: ${RETRANSLATED} succeeded, ${STILL_FAILED} still failed"

      - name: Lint translated files
        if: steps.detect.outputs.has_files == 'true'
        run: |
          LINT_COUNT=0

          while IFS= read -r EN_FILE; do
            if [ -z "$EN_FILE" ]; then continue; fi
            file="${EN_FILE/content\/en/content\/ja}"
            if [ ! -f "$file" ]; then continue; fi
            npx markdownlint-cli --fix "$file" 2>/dev/null || true
            npx textlint -c .textlintrc \
              --rulesdir .claude/skills/splunk-workshop-ja-translator/textlint-rules \
              --fix "$file" 2>/dev/null || true
            LINT_COUNT=$((LINT_COUNT + 1))
          done < /tmp/files_to_translate.txt

          echo "Linted ${LINT_COUNT} files"

      - name: Check en/ja structure parity
        id: parity
        if: steps.detect.outputs.has_files == 'true'
        run: |
          # Phase 3（構造検証）: 翻訳結果がen側と「本文以外」で一致しているかを機械検証する。
          # 不一致はPR本文に警告として記載する（ハードフェイルにはしない）
          : > /tmp/parity_warnings.txt

          while IFS= read -r EN_FILE; do
            if [ -z "$EN_FILE" ]; then continue; fi
            JA_FILE="${EN_FILE/content\/en/content\/ja}"
            if [ ! -f "$JA_FILE" ]; then continue; fi
            bash .github/scripts/check-structure-parity.sh "$EN_FILE" "$JA_FILE" >> /tmp/parity_warnings.txt || true
          done < /tmp/files_to_translate.txt

          WARNING_COUNT=$(grep -c . /tmp/parity_warnings.txt || true)
          echo "warning_count=${WARNING_COUNT}" >> $GITHUB_OUTPUT

          echo "warnings<<PARITY_EOF" >> $GITHUB_OUTPUT
          head -50 /tmp/parity_warnings.txt >> $GITHUB_OUTPUT
          if [ "$WARNING_COUNT" -gt 50 ]; then
            echo "... (truncated)" >> $GITHUB_OUTPUT
          fi
          echo "PARITY_EOF" >> $GITHUB_OUTPUT

          if [ "$WARNING_COUNT" -gt 0 ]; then
            echo "::warning::${WARNING_COUNT} structure parity issue(s) detected"
            cat /tmp/parity_warnings.txt
          else
            echo "All translated files match the English structure"
          fi

      - name: Commit translations
        id: commit
        if: steps.detect.outputs.has_files == 'true' || steps.mirror.outputs.changed == 'true'
        run: |
          # Only add content/ja/ directory
          git add content/ja/

          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_commits=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          NEW_TAG="${{ needs.check-new-release.outputs.new_tag }}"
          TRANSLATED_COUNT="${{ steps.translate.outputs.translated_count || '0' }}"
          FAILED_COUNT="${{ steps.translate.outputs.failed_count || '0' }}"

          printf '%s\n\n%s\n\n%s\n%s\n\n%s\n' \
            "Add Japanese translations for ${NEW_TAG}" \
            "Automatically translated using Claude Code with AWS Bedrock." \
            "- Translated files: ${TRANSLATED_COUNT}" \
            "- Failed files: ${FAILED_COUNT}" \
            "Generated by GitHub Actions" > /tmp/commit_msg.txt

          git commit -F /tmp/commit_msg.txt
          echo "has_commits=true" >> $GITHUB_OUTPUT

      - name: Push translation branch
        if: steps.commit.outputs.has_commits == 'true'
        run: |
          BRANCH="${{ steps.translate-branch.outputs.branch_name }}"
          # Force push if branch already exists (from previous failed run)
          git push -u origin "${BRANCH}" --force

  create-pr:
    name: Create PR for review
    needs: [check-new-release, sync-and-translate]
    if: inputs.run_mode != 'cleanup-only' && needs.sync-and-translate.outputs.has_commits == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    outputs:
      pr_number: ${{ steps.create-pr.outputs.pr_number }}
    steps:
      - name: Checkout translation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.sync-and-translate.outputs.translation_branch }}
          fetch-depth: 1

      - name: Create Pull Request to upstream
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_PAT }}
          # ファイル名を含む複数行出力はシェル変数展開ではなくenv経由で渡す（インジェクション対策）
          MIRROR_CHANGE_COUNT: ${{ needs.sync-and-translate.outputs.mirror_change_count }}
          MIRROR_REPORT: ${{ needs.sync-and-translate.outputs.mirror_report }}
          PARITY_WARNING_COUNT: ${{ needs.sync-and-translate.outputs.parity_warning_count }}
          PARITY_WARNINGS: ${{ needs.sync-and-translate.outputs.parity_warnings }}
        run: |
          NEW_TAG="${{ needs.check-new-release.outputs.new_tag }}"
          TRANSLATED_COUNT="${{ needs.sync-and-translate.outputs.translated_count }}"
          FAILED_COUNT="${{ needs.sync-and-translate.outputs.failed_count }}"
          HAS_NEW_WORKSHOPS="${{ needs.sync-and-translate.outputs.has_new_workshops }}"
          NEW_WORKSHOPS="${{ needs.sync-and-translate.outputs.new_workshops }}"

          # Build PR body
          {
            printf '%s\n' \
              "## Description" \
              "" \
              "Japanese translations for release ${NEW_TAG}." \
              "" \
              "- **Translated files**: ${TRANSLATED_COUNT:-0}" \
              "- **Failed files**: ${FAILED_COUNT:-0}"

            # Asset mirror / orphan cleanup section (only when changes were made)
            if [ -n "${MIRROR_CHANGE_COUNT:-}" ] && [ "${MIRROR_CHANGE_COUNT}" != "0" ]; then
              printf '%s\n' \
                "" \
                "## Asset sync and orphan cleanup" \
                "" \
                "Non-markdown assets were mirrored from \`content/en\`, and Japanese files with no English counterpart were removed:" \
                "" \
                '```text'
              printf '%s\n' "${MIRROR_REPORT}"
              printf '%s\n' '```'
            fi

            # Structure parity warnings section (only when mismatches were found)
            if [ -n "${PARITY_WARNING_COUNT:-}" ] && [ "${PARITY_WARNING_COUNT}" != "0" ]; then
              printf '%s\n' \
                "" \
                "## :warning: Structure parity warnings" \
                "" \
                "These files differ from the English source in structure (frontmatter keys, shortcodes, headings, or code fences) and need review:" \
                "" \
                '```text'
              printf '%s\n' "${PARITY_WARNINGS}"
              printf '%s\n' '```'
            fi

            # Add new workshops section if detected
            if [ "$HAS_NEW_WORKSHOPS" = "yes" ]; then
              printf '%s\n' \
                "" \
                "## :warning: New Workshops Detected" \
                "" \
                "The following new workshops were detected and require careful review:" \
                ""
              echo "$NEW_WORKSHOPS" | while IFS= read -r workshop; do
                if [ -n "$workshop" ]; then
                  WORKSHOP_NAME=$(basename "$workshop")
                  printf '%s\n' "- \`${workshop}\` (**${WORKSHOP_NAME}**)"
                fi
              done
              printf '%s\n' \
                "" \
                "> This PR was created as a **draft** because new workshops were detected." \
                "> Please review the new workshop translations carefully before marking as ready."
            fi

            printf '%s\n' \
              "" \
              "This PR adds Japanese translations for the workshop content." \
              "" \
              "### Type of change" \
              "" \
              "none" \
              ""

            if [ "$HAS_NEW_WORKSHOPS" = "yes" ]; then
              printf '%s\n' \
                "## How Has This Been Tested?" \
                "" \
                "- [ ] Run \`hugo serve\` locally and verify Japanese pages render correctly" \
                "- [ ] Check that images are displayed" \
                "- [ ] Verify navigation works" \
                ""
            fi

            printf '%s\n' \
              "## Checklist" \
              "" \
              "- [x] My code follows the style guidelines of this project" \
              "- [ ] I have performed a self-review of my own code" \
              "- [x] My changes generate no new warnings" \
              "- [x] Markdown Lint passes locally with my changes" \
              "" \
              "---" \
              "Generated with [Claude Code](https://claude.ai/claude-code) via automated translation workflow."
          } > /tmp/pr_body.md

          TRANSLATION_BRANCH="${{ needs.sync-and-translate.outputs.translation_branch }}"
          FORK_REPO="${{ github.repository }}"
          FORK_OWNER="${{ github.repository_owner }}"

          # 同一ブランチの既存 PR を確認（再実行時の冪等性）
          EXISTING_PR=$(gh pr list \
            --repo "${{ env.UPSTREAM_REPO }}" \
            --head "${FORK_OWNER}:${TRANSLATION_BRANCH}" \
            --state open \
            --json number,url \
            --jq '.[0]' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            PR_NUMBER=$(echo "$EXISTING_PR" | jq -r '.number')
            PR_URL=$(echo "$EXISTING_PR" | jq -r '.url')
            echo "PR already exists: ${PR_URL} (skipping creation)"
          else
            # Create PR to upstream repository
            DRAFT_ARGS=()
            if [ "$HAS_NEW_WORKSHOPS" = "yes" ]; then
              DRAFT_ARGS=(--draft)
              echo "Creating DRAFT PR (new workshops detected)"
            else
              echo "Creating regular PR"
            fi

            PR_URL=$(gh pr create \
              --repo "${{ env.UPSTREAM_REPO }}" \
              --title "Japanese Translation: ${NEW_TAG}" \
              --body-file /tmp/pr_body.md \
              --base main \
              --head "${FORK_OWNER}:${TRANSLATION_BRANCH}" \
              "${DRAFT_ARGS[@]}") || {
              echo "::error::upstream PR creation failed. Manual steps to create PR:"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "1. Ensure UPSTREAM_PAT secret is valid (expiry <= 90 days for Splunk enterprise)"
              echo "   Regenerate at: https://github.com/settings/tokens"
              echo "   Required permission: splunk/observability-workshop > Pull requests: Read and write"
              echo ""
              echo "2. Once PAT is updated, create the PR manually:"
              echo "   gh pr create \\"
              echo "     --repo ${{ env.UPSTREAM_REPO }} \\"
              echo "     --title \"Japanese Translation: ${NEW_TAG}\" \\"
              echo "     --base main \\"
              echo "     --head ${FORK_OWNER}:${TRANSLATION_BRANCH}"
              echo ""
              echo "   Or via GitHub web UI:"
              echo "   https://github.com/${FORK_REPO}/tree/${TRANSLATION_BRANCH}"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              exit 1
            }

            echo "Created PR: ${PR_URL}"
            PR_NUMBER=$(echo "$PR_URL" | grep -o '[0-9]*$')
          fi
          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT

  cleanup-stale-prs:
    name: Close superseded translation PRs
    needs: [check-new-release, sync-and-translate, create-pr]
    if: |
      always()
      && (inputs.run_mode == 'cleanup-only' || needs.create-pr.outputs.pr_number != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      closed_count: ${{ steps.close.outputs.closed_count }}
      skipped_count: ${{ steps.close.outputs.skipped_count }}
      skipped_prs: ${{ steps.close.outputs.skipped_prs }}
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_PAT }}
      FORK_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Close superseded PRs on upstream
        id: close
        env:
          NEW_PR_INPUT: ${{ needs.create-pr.outputs.pr_number }}
          NEW_BRANCH_INPUT: ${{ needs.sync-and-translate.outputs.translation_branch }}
          NEW_TAG_INPUT: ${{ needs.check-new-release.outputs.new_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          NEW_PR="${NEW_PR_INPUT}"
          NEW_BRANCH="${NEW_BRANCH_INPUT}"
          NEW_TAG="${NEW_TAG_INPUT}"
          DRY_RUN="${DRY_RUN:-false}"
          MAX="${CLEANUP_MAX_PRS:-10}"

          # cleanup_only モード時は最新マージ済み翻訳PRから値を補完
          if [ -z "$NEW_PR" ]; then
            LATEST=$(gh pr list --repo "${UPSTREAM_REPO}" \
              --search "is:pr is:merged author:${FORK_OWNER} translate" \
              --json number,headRefName,title --limit 1 --jq '.[0] // empty')
            if [ -n "$LATEST" ]; then
              NEW_PR=$(jq -r '.number // ""' <<<"$LATEST")
              NEW_BRANCH=$(jq -r '.headRefName // ""' <<<"$LATEST")
              NEW_TAG=$(jq -r '.title // ""' <<<"$LATEST" | sed 's/^Japanese Translation: //')
            fi
          fi

          if [ -z "$NEW_PR" ]; then
            echo "No reference PR found, skipping cleanup"
            echo "closed_count=0" >> $GITHUB_OUTPUT
            echo "skipped_count=0" >> $GITHUB_OUTPUT
            echo "skipped_prs=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Reference PR: #${NEW_PR} (head=${NEW_BRANCH}, tag=${NEW_TAG})"
          echo "DRY_RUN=${DRY_RUN}, MAX=${MAX}"

          gh pr list --repo "${UPSTREAM_REPO}" \
            --search "is:open is:pr author:${FORK_OWNER}" \
            --json number,headRefName,headRepositoryOwner --limit 50 \
            | jq -c '.[] | select(.headRefName | startswith("translate/"))' > /tmp/prs.json || true

          CLOSED=0
          SKIPPED=0
          SKIPPED_LIST=""

          while IFS= read -r pr; do
            [ -z "$pr" ] && continue
            N=$(jq -r .number <<<"$pr")
            HEAD=$(jq -r .headRefName <<<"$pr")
            OWNER=$(jq -r '.headRepositoryOwner.login // ""' <<<"$pr")

            [ "$OWNER" = "$FORK_OWNER" ] || continue
            [ "$N" -ge "$NEW_PR" ] && continue
            [ "$HEAD" = "$NEW_BRANCH" ] && continue
            [ "$CLOSED" -ge "$MAX" ] && { echo "Reached MAX=$MAX, stopping"; break; }

            DETAIL=$(gh pr view "$N" --repo "${UPSTREAM_REPO}" --json commits,reviews)
            HUMAN=$(jq --arg fo "$FORK_OWNER" \
              '[.commits[] | select((.authors // []) | map(.login) | any(. != "github-actions[bot]" and . != $fo))] | length' \
              <<<"$DETAIL")
            REVIEWS=$(jq '[.reviews[] | select(.state != "PENDING")] | length' <<<"$DETAIL")

            if [ "$HUMAN" -gt 0 ] || [ "$REVIEWS" -gt 0 ]; then
              echo "SKIP PR #$N (human_commits=$HUMAN, reviews=$REVIEWS)"
              SKIPPED=$((SKIPPED + 1))
              SKIPPED_LIST="${SKIPPED_LIST} #${N}"
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "[DRY-RUN] would close PR #$N (head=$HEAD)"
            else
              gh pr comment "$N" --repo "${UPSTREAM_REPO}" \
                --body "Superseded by #${NEW_PR} (translation for ${NEW_TAG}). Closing this PR." || true
              gh pr close "$N" --repo "${UPSTREAM_REPO}" || true
              echo "Closed PR #$N"
            fi
            CLOSED=$((CLOSED + 1))
          done < /tmp/prs.json

          echo "closed_count=${CLOSED}" >> $GITHUB_OUTPUT
          echo "skipped_count=${SKIPPED}" >> $GITHUB_OUTPUT
          echo "skipped_prs=${SKIPPED_LIST# }" >> $GITHUB_OUTPUT

          echo "Summary: closed=${CLOSED}, skipped=${SKIPPED}, skipped_prs='${SKIPPED_LIST# }'"

  cleanup-fork-branches:
    name: Delete merged/closed translate branches on fork
    needs: [check-new-release, sync-and-translate, create-pr, cleanup-stale-prs]
    if: |
      always()
      && (inputs.run_mode == 'cleanup-only' || needs.create-pr.outputs.pr_number != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      deleted_count: ${{ steps.delete.outputs.deleted_count }}
    env:
      GH_TOKEN: ${{ github.token }}
      FORK_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout (for git push)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Delete fork translate branches with no open PR
        id: delete
        env:
          CURRENT_BRANCH: ${{ needs.sync-and-translate.outputs.translation_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          DRY_RUN="${DRY_RUN:-false}"
          DELETED=0

          git ls-remote --heads origin 'translate/v*' \
            | awk '{print $2}' | sed 's|refs/heads/||' > /tmp/branches.txt || true

          while IFS= read -r BR; do
            [ -z "$BR" ] && continue
            [ "$BR" = "$CURRENT_BRANCH" ] && { echo "KEEP $BR (current run)"; continue; }

            # gh pr list --head "owner:branch" は public fork PR で空配列を返す既知の挙動があるため
            # search 構文を使う（is:pr head:BR author:OWNER）
            STATE=$(gh pr list --repo "${UPSTREAM_REPO}" \
              --search "is:pr head:${BR} author:${FORK_OWNER}" --state all \
              --json state --jq '.[0].state // "NONE"')

            case "$STATE" in
              OPEN)
                echo "KEEP $BR (open PR exists)"
                ;;
              MERGED|CLOSED)
                if [ "$DRY_RUN" = "true" ]; then
                  echo "[DRY-RUN] would delete $BR (PR=$STATE)"
                else
                  git push origin --delete "$BR" || true
                  echo "Deleted $BR (PR=$STATE)"
                fi
                DELETED=$((DELETED + 1))
                ;;
              NONE)
                # PR が見つからないブランチは安全側に倒して保持。手動で確認すべき
                echo "KEEP $BR (no PR found, manual review required)"
                ;;
            esac
          done < /tmp/branches.txt

          echo "deleted_count=${DELETED}" >> $GITHUB_OUTPUT
          echo "Summary: deleted=${DELETED}"

  update-tag-tracking:
    name: Update last translated tag
    needs: [check-new-release, create-pr, cleanup-stale-prs]
    if: always() && needs.create-pr.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout translation system branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref }}
          # ja-translation-system has a ruleset that requires PR review.
          # FORK_SYNC_PAT (admin role) bypasses the ruleset to push tag updates directly.
          token: ${{ secrets.FORK_SYNC_PAT }}

      - name: Update last translated tag file
        run: |
          NEW_TAG="${{ needs.check-new-release.outputs.new_tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "${NEW_TAG}" > "${{ env.LAST_TAG_FILE }}"
          git add "${{ env.LAST_TAG_FILE }}"

          # retranslate-latest / fill-missing-translations では同一タグの再実行になるため、
          # 変更がない場合はコミットせず正常終了する
          if git diff --staged --quiet; then
            echo "Tag file unchanged (${NEW_TAG}), skipping commit"
            exit 0
          fi

          git commit -m "Update last translated tag to ${NEW_TAG}"
          git push

  retry-on-failure:
    name: Auto-retry after translation failure
    needs: [check-new-release, sync-and-translate]
    # 翻訳ジョブが失敗（タイムアウト含む）した場合、同一設定で自身を再dispatchする。
    # レジューム機構により再実行は未翻訳分のみを処理する。無限ループ防止のため2回まで。
    # workflow_dispatch は GITHUB_TOKEN の再帰トリガー制限の例外なので PAT は不要
    if: >-
      always()
      && needs.check-new-release.outputs.has_new_release == 'true'
      && needs.sync-and-translate.result == 'failure'
      && (inputs.retry_attempt || 0) < 2
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Re-dispatch workflow to resume translation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEXT_ATTEMPT=$(( ${{ inputs.retry_attempt || 0 }} + 1 ))
          echo "Translation job failed; re-dispatching (attempt ${NEXT_ATTEMPT}/2)"
          gh workflow run sync-and-translate.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f run_mode="${RUN_MODE:-auto}" \
            -f retry_attempt="${NEXT_ATTEMPT}"

  notify-slack:
    name: Notify Slack
    needs: [check-new-release, sync-and-translate, create-pr, cleanup-stale-prs, cleanup-fork-branches]
    if: >-
      always()
      && needs.check-new-release.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Determine workflow status
        id: status
        run: |
          if [ "${{ needs.check-new-release.result }}" = "failure" ] || \
             [ "${{ needs.sync-and-translate.result }}" = "failure" ] || \
             [ "${{ needs.create-pr.result }}" = "failure" ]; then
            echo "result=failure" >> $GITHUB_OUTPUT
          else
            echo "result=success" >> $GITHUB_OUTPUT
          fi

      - name: Determine notification reason
        id: reason
        run: |
          HAS_NEW_RELEASE="${{ needs.check-new-release.outputs.has_new_release }}"
          TRANSLATED_COUNT="${{ needs.sync-and-translate.outputs.translated_count }}"

          if [ "$HAS_NEW_RELEASE" != "true" ]; then
            echo "result=no_new_release" >> $GITHUB_OUTPUT
          elif [ -z "$TRANSLATED_COUNT" ] || [ "$TRANSLATED_COUNT" = "0" ]; then
            echo "result=no_translation_targets" >> $GITHUB_OUTPUT
          else
            echo "result=translated" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        run: |
          # NOTE: hasNewWorkshopTranslation uses "yes"/"no" instead of "true"/"false".
          # Slack Workflow Builder has a bug where the string "true" causes branch condition
          # evaluation errors even when the field type is text. Verified 2026-03-30.
          HAS_NEW_WORKSHOP="${{ needs.sync-and-translate.outputs.has_new_workshops }}"
          HAS_NEW_WORKSHOP="${HAS_NEW_WORKSHOP:-no}"
          TRANSLATED_COUNT="${{ needs.sync-and-translate.outputs.translated_count }}"
          FAILED_COUNT="${{ needs.sync-and-translate.outputs.failed_count }}"
          PR_NUMBER="${{ needs.create-pr.outputs.pr_number }}"
          STALE_CLOSED="${{ needs.cleanup-stale-prs.outputs.closed_count }}"
          STALE_SKIPPED="${{ needs.cleanup-stale-prs.outputs.skipped_count }}"
          STALE_SKIPPED_PRS="${{ needs.cleanup-stale-prs.outputs.skipped_prs }}"
          BRANCHES_DELETED="${{ needs.cleanup-fork-branches.outputs.deleted_count }}"
          JSON_PAYLOAD=$(cat <<EOF
          {
            "hasNewWorkshopTranslation": "${HAS_NEW_WORKSHOP}",
            "translatedMarkdownFileCount": "${TRANSLATED_COUNT:-0}",
            "failedFileCount": "${FAILED_COUNT:-0}",
            "pullRequestNumber": "${PR_NUMBER:-}",
            "staleClosedCount": "${STALE_CLOSED:-0}",
            "staleSkippedCount": "${STALE_SKIPPED:-0}",
            "staleSkippedPrs": "${STALE_SKIPPED_PRS:-}",
            "forkBranchesDeleted": "${BRANCHES_DELETED:-0}",
            "status": "${{ steps.status.outputs.result }}",
            "reason": "${{ steps.reason.outputs.result }}"
          }
          EOF
          )

          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "${JSON_PAYLOAD}"
